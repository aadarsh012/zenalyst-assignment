spring:
  application:
    name: housing-allocation

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/housing}
    username: ${DB_USER:housing}
    password: ${DB_PASSWORD:housing}
    hikari:
      pool-name: housing-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate never creates or alters a table:
      # a schema that drifts from its migrations cannot be audited.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

housing:
  identity:
    # Keys the token that stands in for an applicant's national identity number. Kept out of the
    # database on purpose: a database compromise alone must not be enough to recover the numbers.
    # Override in every real environment (env: HOUSING_IDENTITY_PEPPER); the application refuses
    # to start with this value under a non-development profile.
    pepper: ${HOUSING_IDENTITY_PEPPER:development-pepper-not-for-production}

  deduplication:
    # Trigram similarity above which two same-birthday names are put in front of a human.
    # 0.80 pairs "RAMESH KUMAR" with "RAMESH KUMARR" but not with "RAJESH KUMAR".
    # Lowering it raises recall and the operator's workload; raising it lets duplicates through.
    # Nothing at this tier is ever merged automatically, so the cost of a false positive is a
    # human glancing at two names, and the cost of a false negative is someone holding two
    # tickets in the draw. It is set to err towards the former.
    name-similarity-threshold: 0.80

  eligibility:
    # Age is measured at the scheme's closing date, not at the moment the check runs, so that
    # every applicant is judged at the same instant however long processing takes.
    minimum-age: 18
    # Annual household income ceiling for an EWS claim to stand. Phase 4 moves this, with the
    # quota matrix, into a versioned rule document; it lives here until then.
    ews-annual-income-limit: 300000

server:
  port: 8080
  error:
    # Errors are returned as RFC 9457 ProblemDetail from our handler, never as
    # Spring's default whitelabel body.
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: housing-allocation
    description: Verifiable housing scheme allocation backend

logging:
  level:
    org.flywaydb: INFO
