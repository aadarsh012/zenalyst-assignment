spring:
  application:
    name: housing-allocation

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/housing}
    username: ${DB_USER:housing}
    password: ${DB_PASSWORD:housing}
    hikari:
      pool-name: housing-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate never creates or alters a table:
      # a schema that drifts from its migrations cannot be audited.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    # Errors are returned as RFC 9457 ProblemDetail from our handler, never as
    # Spring's default whitelabel body.
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: housing-allocation
    description: Verifiable housing scheme allocation backend

logging:
  level:
    org.flywaydb: INFO
