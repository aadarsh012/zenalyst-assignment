services:
  postgres:
    image: postgres:16-alpine
    container_name: housing-postgres
    environment:
      POSTGRES_DB: housing
      POSTGRES_USER: housing
      POSTGRES_PASSWORD: housing
      # Deterministic collation: ORDER BY on text must not vary by host locale,
      # or "the same query" returns different orderings on different machines.
      LANG: C
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - housing-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housing -d housing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  housing-pgdata:
